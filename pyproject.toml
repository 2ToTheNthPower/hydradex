[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hydradex"
version = "0.2.0"
description = "Hydra YAML intelligence as a Python library and language server"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "lsprotocol>=2025.0.0,<2026",
  "pathspec>=0.12.1,<1",
  "pygls>=2.0.0,<3",
  "PyYAML>=6.0.2,<7",
  "ty>=0.0.83,<0.1",
]

[project.scripts]
hydradex = "hydradex.__main__:main"

[project.optional-dependencies]
examples = ["hydra-core>=1.3.2,<1.4"]

[project.urls]
Repository = "https://github.com/2ToTheNthPower/hydradex"

[dependency-groups]
dev = [
  "hydra-core>=1.3.2,<1.4",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["hydradex"]
branch = true
patch = ["subprocess"]

[tool.coverage.report]
show_missing = true
